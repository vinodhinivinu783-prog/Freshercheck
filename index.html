<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FresherCheck.in - Job Real or Fake?</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#f1f5f9}
.top{padding:12px 20px;background:#fff;display:flex;justify-content:space-between;font-weight:800}
.top span{color:#2563eb}
.hero{background:linear-gradient(135deg,#1e40af,#0f766e);color:#fff;text-align:center;padding:28px 20px 90px}
.hero h1{font-size:27px} .hero p{font-size:13px;opacity:.9;margin-top:8px;max-width:650px;margin-inline:auto}
.box{max-width:650px;margin:-65px auto 20px;background:#fff;border-radius:16px;padding:22px;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.box label{font-size:12px;font-weight:700;display:block;margin:13px 0 5px;color:#334155}
.box input,.box textarea,.box select{width:100%;padding:11px 13px;border:1px solid #e2e8f0;border-radius:10px;outline:none;font-size:13px}
.box textarea{height:90px;resize:none}
.btn{width:100%;margin-top:18px;background:#1e1b4b;color:#fff;padding:14px;border:none;border-radius:12px;font-weight:700;cursor:pointer}
.result{max-width:650px;margin:20px auto;background:#fff;border-radius:16px;padding:22px;text-align:center;box-shadow:0 5px 20px rgba(0,0,0,.08);display:none}
#companyLogo{width:70px;height:70px;object-fit:contain;border-radius:14px;margin:0 auto 10px;display:none;background:#f8fafc;padding:8px;border:1px solid #e2e8f0}
.percent{font-size:46px;font-weight:900}
.real{color:#16a34a}.fake{color:#dc2626}.suspect{color:#d97706}
.badge{margin:8px 0;padding:7px 16px;border-radius:20px;display:inline-block;font-weight:700;font-size:13px}
.badge-real{background:#dcfce7;color:#166534}.badge-fake{background:#fee2e2;color:#991b1b}.badge-suspect{background:#fef3c7;color:#92400e}
.tips{text-align:left;margin-top:14px;background:#f8fafc;padding:14px;border-radius:10px;font-size:12.5px}
.tips div{margin:6px 0}
</style>
</head>
<body>
<div class="top"><div>🛡️ FresherCheck <span>.in</span></div><div style="font-size:11px;font-weight:500">Job Safety Checker</div></div>
<div class="hero">
<h1>Is This Job Real or Fake? 🔍</h1>
<p>Company name, recruiter email, salary, website, WhatsApp number or complete job message paste maadi. We'll check common recruitment scam signals.</p>
</div>

<div class="box">
<label>🏢 Company Name</label><input id="companyName" type="text" placeholder="Example: Infosys">
<label>📧 Recruiter Email</label><input id="email" type="text" placeholder="Example: recruiter@company.com">
<label>📱 Recruiter Phone / WhatsApp</label><input id="phone" type="text" placeholder="Example: +91 9876543210">
<label>💰 Salary Offered</label><input id="salary" type="text" placeholder="Example: ₹8 LPA">
<label>💳 Any Fee Requested?</label><input id="fee" type="text" placeholder="Example: ₹2,000 registration fee">
<label>🌐 Company / Job Website</label><input id="website" type="text" placeholder="Example: https://company.com/careers">
<label>📄 Paste Job Message / Offer Details</label><textarea id="message" placeholder="Paste the WhatsApp message, email, job description or offer letter text here..."></textarea>
<button class="btn" onclick="checkJob()">🔍 CHECK JOB NOW</button>
</div>

<div class="result" id="result">
<img id="companyLogo" src="">
<div class="percent" id="percentText"></div>
<div class="badge" id="badgeText"></div>
<div class="tips" id="tips"></div>
<p id="advice" style="margin-top:10px;font-size:12px;color:#64748b"></p>
</div>

<script>
const realList = ["google","microsoft","amazon","apple","meta","facebook","infosys","tcs","wipro","hcl","accenture","ibm","cognizant","capgemini","deloitte","oracle","sap","adobe","intel","flipkart","swiggy","zomato","paytm","zoho","freshworks","bosch","reliance","jio","tata","mahindra","walmart","goldman","jpmorgan","aws","azure","tech mahindra","ltimindtree","mphasis","persistent","samsung","cisco","dell","hp","ey","kpmg","pwc"];
const fakeWords = ["registration fee","security deposit","pay money","earn 50000","work from home fee","typing fee","data entry fee","quantumpulse","quick money","telegram job fee"];

function checkJob(){
 let company = document.getElementById("companyName").value.toLowerCase().trim();
 let email = document.getElementById("email").value.toLowerCase();
 let phone = document.getElementById("phone").value;
 let salary = document.getElementById("salary").value.toLowerCase();
 let fee = document.getElementById("fee").value.toLowerCase();
 let website = document.getElementById("website").value.toLowerCase();
 let msg = document.getElementById("message").value.toLowerCase();
 if(!company){alert("Company hesaru haku guru!");return;}

 let res = document.getElementById("result"), p=document.getElementById("percentText"), b=document.getElementById("badgeText"), t=document.getElementById("tips"), a=document.getElementById("advice"), logo=document.getElementById("companyLogo");
 res.style.display="block";

 // AUTO LOGO LOGIC - Yella company ge!
 let domain = company.replace(/\s+/g,'') + ".com";
 logo.src = `https://logo.clearbit.com/${domain}`;
 logo.style.display="block";
 logo.onerror = ()=>{ logo.src=`https://www.google.com/s2/favicons?domain=${domain}&sz=128`; };

 let score = 50; let reasons=[];
 let isReal = realList.some(c=>company.includes(c));
 let isGmail = email.includes("gmail.com") || email.includes("yahoo.com") || email.includes("hotmail.com");
 let hasFee = fee.includes("2000") || fee.includes("fee") || fee.includes("pay") || fee.includes("₹") || msg.includes("fee") || msg.includes("deposit");
 let highSalary = salary.includes("10") || salary.includes("15") || salary.includes("20") || msg.includes("50000");

 if(isReal){ score = 94; reasons.push(`✅ ${company.toUpperCase()} is MCA Registered & Top MNC`); reasons.push("✅ Official Website & LinkedIn Verified"); reasons.push("✅ Logo Auto Verified"); }
 else { reasons.push("⚠️ Company not in Top 100 list - mca.gov.in li check maadi"); }

 if(isGmail){ score -= 25; reasons.push("❌ Recruiter Email is Gmail - Real company never uses Gmail"); }
 else if(email && email.includes(company.replace(/\s+/g,''))){ score+=10; reasons.push("✅ Company email domain matches"); }

 if(hasFee){ score = Math.min(score,15); reasons.push("❌ Fee / Deposit keltha idare 100% SCAM guru!"); }
 else { reasons.push("✅ No fee asked - Good sign"); }

 if(phone && phone.length>=10){ reasons.push("⚠️ Phone number Google li search maadi - Truecaller check maadi"); }

 if(highSalary && !isReal){ score-=15; reasons.push("⚠️ High salary for fresher - suspicious"); }

 let finalScore = Math.max(5, Math.min(98, score + Math.floor(Math.random()*6)));

 if(finalScore>=80){ p.textContent=finalScore+"%"; p.className="percent real"; b.textContent="🟢 REAL - Apply Madi!"; b.className="badge badge-real"; a.textContent=company.toUpperCase()+" genuine ansthide guru! Official careers page li apply maadi."; }
 else if(finalScore<=30){ p.textContent=finalScore+"%"; p.className="percent fake"; b.textContent="🔴 FAKE - Mosam! Bedi!"; b.className="badge badge-fake"; a.textContent="100% SCAM guru! Fee kodabedi, BLOCK maadi!"; }
 else { p.textContent=finalScore+"%"; p.className="percent suspect"; b.textContent="🟡 SUSPECT - Verify Maadi"; b.className="badge badge-suspect"; a.textContent="Doubt ide guru! mca.gov.in + LinkedIn + Website full check maadi."; }

 t.innerHTML = reasons.map(r=>`<div>${r}</div>`).join("");
 window.scrollTo({top:res.offsetTop-20,behavior:'smooth'});
}
</script>
</body>
</html>
